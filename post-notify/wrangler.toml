name = "dusk-post-notify"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]   # node:crypto, for Patreon's HMAC-MD5 webhook signature

# Non-secret config.
[vars]
DUSK_CAMPAIGN_ID   = "14880404"                 # Dusk Audio's Patreon campaign id (same as builds-gate)
TAG_NAME           = "Patreon member (auto)"    # Kit tag the Worker keeps on subscribers who are on Patreon; created on first run
KIT_FORM_ID        = "10132808"                 # Kit form "Newsletter site"; its confirmation email is the double opt-in
ALLOWED_ORIGINS    = "https://duskaudio.com"    # comma-separated origins that may read /subscribe's answers (CORS)
TURNSTILE_HOSTNAME = "duskaudio.com"            # a signup's Turnstile token must come from this hostname; "" skips the check
SEND_MODE          = "draft"                    # "draft" = leave the broadcast for review; "send" = schedule it 10 minutes out
PUBLIC_ONLY        = "0"                        # "1" = ignore patron-only posts

# Secrets: set with `wrangler secret put NAME`, NEVER put values here:
#   wrangler secret put PATREON_WEBHOOK_SECRET   # shown next to the webhook in the Patreon developer portal
#   wrangler secret put PATREON_CREATOR_TOKEN    # Creator's Access Token of the Patreon API client
#   wrangler secret put KIT_API_KEY              # Kit -> Settings -> Developer -> API keys (V4)
#   wrangler secret put TURNSTILE_SECRET         # Cloudflare -> Turnstile -> the duskaudio.com widget's secret key
#   wrangler secret put ADMIN_TOKEN              # random, guards POST /sync (e.g. `openssl rand -hex 32`)

[observability]
enabled = true
