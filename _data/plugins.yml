    algorithms, and a screaming acid bass box with a step sequencer. 54 factory
    presets and a user preset library. Completely free.
  status: released
  featured: true
  version: 1.0.2
  released: "2026-07-26"
- name: Convolution Reverb
  slug: convolution-reverb
