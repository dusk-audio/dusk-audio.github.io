  status: released
  featured: true
  version: 0.7.0
  released: "2026-02-25"
- name: Sunset Circuits
  slug: sunset-circuits
  tagline: Six vintage synth circuits in one instrument
  description: Six classic synthesizers under one roof, one instrument that
