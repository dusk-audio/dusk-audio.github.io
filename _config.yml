# Dusk Audio - Jekyll Configuration
title: Dusk Audio
description: Dusk Studio, a focused desktop portastudio, and free instruments and effects for Linux, Windows, and macOS
url: "https://duskaudio.com"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Plugins
plugins:
  - jekyll-sitemap

# Sass/SCSS
sass:
  style: compressed

# Collections
collections:
  plugins:
    output: true
    permalink: /plugins/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "plugins"
    values:
      layout: "plugin"

# Site links
github_repo: https://github.com/dusk-audio/dusk-audio-plugins
releases_url: https://github.com/dusk-audio/dusk-audio-plugins/releases
patreon_url: https://www.patreon.com/cw/DuskAudio
patreon_membership_url: https://www.patreon.com/cw/DuskAudio/membership
kofi_url: https://ko-fi.com/duskaudio
# Link preview (og:image) for every page except plugin pages, which use their own card in
# assets/images/social/. .github/scripts/social-cards.py makes them all.
social_image:
  path: /assets/images/social/dusk-studio.jpg
  alt: Dusk Studio playing a multitrack mix with active channel, bus, and stereo master meters
# Email signup (_includes/email-capture.html). The form posts to the post-notify Worker's
# /subscribe, which verifies the Cloudflare Turnstile token server-side (that is what stops bots
# posting directly) and adds the address to Kit. The sitekey is public; its secret is the
# Worker's TURNSTILE_SECRET.
newsletter_subscribe_url: https://dusk-post-notify.duskaudio.workers.dev/subscribe
turnstile_sitekey: 0x4AAAAAAFxQUjt03bCMtkTE

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - builds-gate
  - post-notify
  - design-qa.md
