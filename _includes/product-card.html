{% assign product = include.product %}
<article class="product-card">
  <a class="product-card-shot" href="{{ '/plugins/' | append: product.slug | append: '/' | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ '/assets/images/plugins/' | append: product.slug | append: '-screenshot.png' | relative_url }}" alt="" loading="lazy" decoding="async">
  </a>
  <div class="product-card-copy">
    <p class="eyebrow">{{ product.category }} · Free plugin</p>
    <h3><a href="{{ '/plugins/' | append: product.slug | append: '/' | relative_url }}">{{ product.name }}</a></h3>
    <p>{{ product.summary | default: product.tagline }}</p>
    <div class="product-card-actions">
      <a class="text-link" href="{{ '/plugins/' | append: product.slug | append: '/' | relative_url }}">Explore {{ product.name }}</a>
      <a class="text-link" href="{{ site.releases_url }}/tag/{{ product.slug }}-v{{ product.version }}">Download<span class="visually-hidden"> {{ product.name }}</span></a>
    </div>
  </div>
</article>
